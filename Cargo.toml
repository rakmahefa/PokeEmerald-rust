[workspace]
resolver = "3"
members = [
    "crates/emerald-core",
    "crates/emerald-game",
    "crates/emerald-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = "=0.20.0"
dioxus = { version = "=0.7.10", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
